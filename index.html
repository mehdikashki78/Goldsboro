<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Markets</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0a0e17;
            --card: #141925;
            --card-h: #1c2333;
            --border: rgba(255,255,255,0.08);
            --text: #f0f4fc;
            --dim: #8a96b0;
            --faint: #5a6680;
            --pos: #4ade80;
            --neg: #f87171;
            --neu: #fbbf24;
            --gold-1: #f6d365; --gold-2: #fda085;
            --btc-1: #f7931a; --btc-2: #ffb84d;
            --eth-1: #627eea; --eth-2: #8da6ff;
            --doge-1: #c2a633; --doge-2: #f4d03f;
        }
        body.light {
            --bg: #eef1f8;
            --card: #ffffff;
            --card-h: #f7f8fc;
            --border: rgba(0,0,0,0.08);
            --text: #0a1024;
            --dim: #4a5470;
            --faint: #8892a8;
            --pos: #059669;
            --neg: #dc2626;
        }
        body {
            font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
            color: var(--text);
            background: var(--bg);
            min-height: 100vh;
            padding: 12px;
        }
        .container { max-width: 1100px; margin: 0 auto; }

        /* Header */
        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 14px; border-radius: 12px;
            background: var(--card); border: 1px solid var(--border);
            margin-bottom: 10px; gap: 10px; flex-wrap: nowrap;
        }
        .title-wrap { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1 1 auto; }
        .logo {
            width: 32px; height: 32px; border-radius: 8px;
            background: linear-gradient(135deg, var(--gold-1), var(--eth-1));
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; flex-shrink: 0;
        }
        h1 {
            font-size: 15px; font-weight: 700;
            display: flex; align-items: center; gap: 8px;
            background: linear-gradient(135deg, var(--gold-1), var(--eth-2));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .badge {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 2px 6px; border-radius: 10px;
            background: rgba(74,222,128,0.15);
            color: var(--pos);
            font-size: 9px; font-weight: 700;
            -webkit-text-fill-color: var(--pos);
        }
        .badge .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--pos); }
        .badge.warn { background: rgba(248,113,113,0.15); color: var(--neg); -webkit-text-fill-color: var(--neg); }
        .badge.warn .dot { background: var(--neg); }
        .subtitle { font-size: 10px; color: var(--dim); margin-top: 1px; }

        .header-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
        .stat {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 4px 8px; border-radius: 20px;
            background: rgba(127,127,127,0.1);
            font-size: 10px; color: var(--dim); font-weight: 600;
        }
        .stat b { color: var(--text); font-weight: 700; }
        .btn {
            width: 28px; height: 28px; border-radius: 50%;
            background: rgba(127,127,127,0.1);
            border: none; color: var(--text); cursor: pointer;
            font-size: 13px; display: flex; align-items: center; justify-content: center;
        }
        .btn:hover { background: rgba(127,127,127,0.2); }

        /* Hero chart */
        .hero {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 12px; padding: 10px 12px;
            margin-bottom: 10px;
        }
        .hero-head {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 6px; gap: 8px;
        }
        .hero-title { font-size: 12px; font-weight: 700; }
        .hero-title .a { color: var(--gold-1); }
        .legend { display: flex; gap: 4px; }
        .leg {
            width: 20px; height: 20px; border-radius: 5px;
            display: flex; align-items: center; justify-content: center;
            background: rgba(127,127,127,0.08);
            cursor: pointer; transition: 0.15s;
        }
        .leg:hover { background: rgba(127,127,127,0.15); }
        .leg.off { opacity: 0.3; }
        .leg-dot { width: 7px; height: 7px; border-radius: 50%; }
        .chart-wrap { width: 100%; height: 100px; }
        #bigChart { width: 100%; height: 100%; display: block; }

        /* Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 8px;
        }
        .card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 12px; padding: 10px;
            position: relative; cursor: pointer;
            transition: 0.15s;
        }
        .card:hover { background: var(--card-h); border-color: rgba(255,255,255,0.15); }
        .card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0;
            height: 2px; border-radius: 12px 12px 0 0;
        }
        .card.gold::before { background: linear-gradient(90deg, var(--gold-1), var(--gold-2)); }
        .card.doge::before { background: linear-gradient(90deg, var(--doge-1), var(--doge-2)); }
        .card.btc::before  { background: linear-gradient(90deg, var(--btc-1), var(--btc-2)); }
        .card.eth::before  { background: linear-gradient(90deg, var(--eth-1), var(--eth-2)); }

        .card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        .icon {
            width: 24px; height: 24px; border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: 800; color: #0a0e17;
        }
        .card.gold .icon { background: linear-gradient(135deg, var(--gold-1), var(--gold-2)); }
        .card.doge .icon { background: linear-gradient(135deg, var(--doge-1), var(--doge-2)); }
        .card.btc .icon  { background: linear-gradient(135deg, var(--btc-1), var(--btc-2)); }
        .card.eth .icon  { background: linear-gradient(135deg, var(--eth-1), var(--eth-2)); color: #fff; }
        .sym {
            font-size: 9px; color: var(--faint); font-weight: 700;
            padding: 2px 6px; border-radius: 10px; background: rgba(127,127,127,0.08);
        }
        .label {
            font-size: 9px; color: var(--dim);
            text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600;
            margin-bottom: 2px;
        }
        .price {
            font-size: 17px; font-weight: 800; color: var(--text);
            font-variant-numeric: tabular-nums; letter-spacing: -0.4px;
            line-height: 1.1; margin: 1px 0 4px;
        }
        .change {
            display: inline-flex; align-items: center; gap: 3px;
            padding: 2px 6px; border-radius: 10px;
            font-size: 10px; font-weight: 700; font-variant-numeric: tabular-nums;
        }
        .change.pos { color: var(--pos); background: rgba(74,222,128,0.12); }
        .change.neg { color: var(--neg); background: rgba(248,113,113,0.12); }
        .change.neu { color: var(--neu); background: rgba(251,191,36,0.12); }
        .change .ar { font-size: 7px; }
        .spark { margin-top: 5px; width: 100%; height: 20px; display: block; }
        .card.loading .price { opacity: 0.3; }

        /* Footer */
        .footer {
            text-align: center; font-size: 10px; color: var(--faint);
            margin-top: 12px; opacity: 0.7;
        }
        .channels { display: flex; justify-content: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
        .ch-label { font-size: 9px; color: var(--dim); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; opacity: 0.6; align-self: center; }
        .ch {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 5px 10px; border-radius: 20px;
            background: var(--card); border: 1px solid var(--border);
            color: var(--text); text-decoration: none;
            font-size: 10px; font-weight: 700;
        }
        .ch:hover { background: #229ed9; border-color: #229ed9; color: #fff; }
        .ch svg { width: 12px; height: 12px; fill: currentColor; }
        .ch .pulse { width: 4px; height: 4px; border-radius: 50%; background: #4ade80; }

        /* Mobile */
        @media (max-width: 600px) {
            body { padding: 8px; }
            .header { padding: 8px 10px; }
            h1 { font-size: 13px; }
            .subtitle { display: none; }
            .logo { width: 28px; height: 28px; font-size: 14px; }
            .grid { grid-template-columns: repeat(2, 1fr); gap: 6px; }
            .card { padding: 8px; }
            .price { font-size: 15px; }
            .chart-wrap { height: 80px; }
            .spark { height: 16px; }
            .icon { width: 22px; height: 22px; font-size: 11px; }
            .stat { padding: 3px 6px; font-size: 9px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="title-wrap">
                <div class="logo">📊</div>
                <div>
                    <h1>Live Markets <span class="badge" id="badge"><span class="dot"></span>LIVE</span></h1>
                    <div class="subtitle">Real-time prices · Gold &amp; Crypto · 24/7</div>
                </div>
            </div>
            <div class="header-right">
                <div class="stat"><span>Next</span> <b id="cd">30</b><span>s</span></div>
                <button class="btn" id="theme" title="Theme">🌙</button>
            </div>
        </div>

        <div class="hero">
            <div class="hero-head">
                <div class="hero-title">Market <span class="a">Overview</span></div>
                <div class="legend">
                    <div class="leg" data-key="gold"><div class="leg-dot" style="background:#f6d365"></div></div>
                    <div class="leg" data-key="doge"><div class="leg-dot" style="background:#f4d03f"></div></div>
                    <div class="leg" data-key="btc"><div class="leg-dot" style="background:#f7931a"></div></div>
                    <div class="leg" data-key="eth"><div class="leg-dot" style="background:#627eea"></div></div>
                </div>
            </div>
            <div class="chart-wrap">
                <svg id="bigChart" viewBox="0 0 1000 240" preserveAspectRatio="none"></svg>
            </div>
        </div>

        <div class="grid">
            <div class="card gold" data-coin="gold">
                <div class="card-head">
                    <div class="icon">🥇</div>
                    <div class="sym">XAU/USD</div>
                </div>
                <div class="label">Gold Spot</div>
                <div class="price" id="goldPrice">---</div>
                <div class="change neu" id="goldChange"><span class="ar">◆</span> --</div>
                <svg class="spark" id="goldSpark" viewBox="0 0 100 50" preserveAspectRatio="none"></svg>
            </div>
            <div class="card doge" data-coin="dogecoin">
                <div class="card-head">
                    <div class="icon">Ð</div>
                    <div class="sym">DOGE/USD</div>
                </div>
                <div class="label">Dogecoin</div>
                <div class="price" id="dogePrice">---</div>
                <div class="change neu" id="dogeChange"><span class="ar">◆</span> --</div>
                <svg class="spark" id="dogeSpark" viewBox="0 0 100 50" preserveAspectRatio="none"></svg>
            </div>
            <div class="card btc" data-coin="bitcoin">
                <div class="card-head">
                    <div class="icon">₿</div>
                    <div class="sym">BTC/USD</div>
                </div>
                <div class="label">Bitcoin</div>
                <div class="price" id="btcPrice">---</div>
                <div class="change neu" id="btcChange"><span class="ar">◆</span> --</div>
                <svg class="spark" id="btcSpark" viewBox="0 0 100 50" preserveAspectRatio="none"></svg>
            </div>
            <div class="card eth" data-coin="ethereum">
                <div class="card-head">
                    <div class="icon">⟠</div>
                    <div class="sym">ETH/USD</div>
                </div>
                <div class="label">Ethereum</div>
                <div class="price" id="ethPrice">---</div>
                <div class="change neu" id="ethChange"><span class="ar">◆</span> --</div>
                <svg class="spark" id="ethSpark" viewBox="0 0 100 50" preserveAspectRatio="none"></svg>
            </div>
        </div>

        <div class="footer">Click any card to refresh</div>
        <div class="channels">
            <span class="ch-label">Channels</span>
            <a href="https://t.me/Gold_Bot" target="_blank" class="ch">
                <svg viewBox="0 0 24 24"><path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z"/></svg>
                <span>Gold</span><span class="pulse"></span>
            </a>
            <a href="https://t.me/Doge_bot" target="_blank" class="ch">
                <svg viewBox="0 0 24 24"><path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z"/></svg>
                <span>Doge</span><span class="pulse"></span>
            </a>
        </div>
    </div>

    <script>
    (function() {
        "use strict";

        // ================== DOM ==================
        const $ = id => document.getElementById(id);
        const els = {
            gold: { p: $('goldPrice'), c: $('goldChange'), s: $('goldSpark') },
            doge: { p: $('dogePrice'), c: $('dogeChange'), s: $('dogeSpark') },
            btc:  { p: $('btcPrice'),  c: $('btcChange'),  s: $('btcSpark')  },
            eth:  { p: $('ethPrice'),  c: $('ethChange'),  s: $('ethSpark')  },
            cd: $('cd'), badge: $('badge'), theme: $('theme'),
            bigChart: $('bigChart'),
        };

        // ================== Config ==================
        const REFRESH = 30;
        const MAX_PTS = 60;
        const TIMEOUT = 7000;
        const STORE = 'mk5';

        // ================== State ==================
        const hist = { gold: [], doge: [], btc: [], eth: [] };
        const prev = { gold: null, doge: null, btc: null, eth: null };
        const vis  = { gold: true, doge: true, btc: true, eth: true };
        const colors = { gold: '#f6d365', doge: '#f4d03f', btc: '#f7931a', eth: '#627eea' };
        let last = null, busy = false, cd = REFRESH, cdT, refT, ever = false;

        // ================== Helpers ==================
        const ok = n => typeof n === 'number' && isFinite(n) && n > 0;
        const fmt = (v, d) => {
            if (!ok(v)) return '---';
            if (Number.isInteger(v)) return v.toLocaleString('en-US');
            return Number(v).toFixed(d).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        };
        const ch = v => {
            if (v == null || !isFinite(v)) return { t: '+0.00%', c: 'neu', a: '◆' };
            const n = +v;
            return {
                t: (n > 0 ? '+' : '') + n.toFixed(2) + '%',
                c: n > 0.0005 ? 'pos' : (n < -0.0005 ? 'neg' : 'neu'),
                a: n > 0.0005 ? '▲' : (n < -0.0005 ? '▼' : '◆')
            };
        };

        function tick() {
            clearInterval(cdT);
            cd = REFRESH; els.cd.textContent = cd;
            cdT = setInterval(() => {
                cd--;
                if (cd <= 0) cd = REFRESH;
                els.cd.textContent = cd;
            }, 1000);
        }

        // ================== Fetch ==================
        async function get(url) {
            const ctrl = new AbortController();
            const t = setTimeout(() => ctrl.abort(), TIMEOUT);
            try {
                const r = await fetch(url, {
                    signal: ctrl.signal, cache: 'no-store',
                    headers: { 'Accept': 'application/json' }
                });
                if (!r.ok) throw 0;
                const txt = await r.text();
                if (!txt) throw 0;
                return JSON.parse(txt.charCodeAt(0) === 0xFEFF ? txt.slice(1) : txt);
            } finally { clearTimeout(t); }
        }

        // GOLD: PAX → XAUT → gold-api
        async function getGold() {
            try {
                const d = await get('https://api.coingecko.com/api/v3/simple/price?ids=pax-gold&vs_currencies=usd&include_24hr_change=true');
                if (d && d['pax-gold'] && ok(d['pax-gold'].usd))
                    return { p: d['pax-gold'].usd, c: typeof d['pax-gold'].usd_24h_change === 'number' ? d['pax-gold'].usd_24h_change : null };
            } catch (_) {}
            try {
                const d = await get('https://api.coingecko.com/api/v3/simple/price?ids=tether-gold&vs_currencies=usd&include_24hr_change=true');
                if (d && d['tether-gold'] && ok(d['tether-gold'].usd))
                    return { p: d['tether-gold'].usd, c: typeof d['tether-gold'].usd_24h_change === 'number' ? d['tether-gold'].usd_24h_change : null };
            } catch (_) {}
            try {
                const d = await get('https://api.gold-api.com/price/XAU');
                if (d && ok(d.price)) return { p: d.price, c: null };
            } catch (_) {}
            return null;
        }

        // CRYPTO: Paprika → CoinGecko → Coinbase
        async function getCrypto(pap, cg, pair) {
            try {
                const d = await get('https://api.coinpaprika.com/v1/tickers/' + pap);
                if (d && d.quotes && d.quotes.USD && ok(d.quotes.USD.price))
                    return { p: d.quotes.USD.price, c: typeof d.quotes.USD.percent_change_24h === 'number' ? d.quotes.USD.percent_change_24h : null };
            } catch (_) {}
            try {
                const d = await get('https://api.coingecko.com/api/v3/simple/price?ids=' + cg + '&vs_currencies=usd&include_24hr_change=true');
                if (d && d[cg] && ok(d[cg].usd))
                    return { p: d[cg].usd, c: typeof d[cg].usd_24h_change === 'number' ? d[cg].usd_24h_change : null };
            } catch (_) {}
            try {
                const d = await get('https://api.coinbase.com/v2/prices/' + pair + '/spot');
                if (d && d.data && d.data.amount) {
                    const pr = parseFloat(d.data.amount);
                    if (ok(pr)) return { p: pr, c: null };
                }
            } catch (_) {}
            return null;
        }

        // ================== Render card ==================
        function renderCard(k, data, isCached) {
            const e = els[k]; if (!e) return;
            if (data && ok(data.p)) {
                const np = data.p;
                const op = prev[k];
                if (op != null && Math.abs(op - np) > 1e-9) prev[k] = np;
                else if (op == null) prev[k] = np;
                e.p.textContent = '$' + fmt(np, k === 'doge' ? 5 : 2);
                const ci = ch(data.c);
                e.c.innerHTML = '<span class="ar">' + ci.a + '</span> ' + ci.t + (isCached ? ' ·cached' : '');
                e.c.className = 'change ' + ci.c;
                if (!isCached) {
                    const h = hist[k];
                    const last2 = h[h.length - 1];
                    if (last2 == null || Math.abs(last2 - np) > 1e-9) {
                        h.push(np);
                        if (h.length > MAX_PTS) h.shift();
                    }
                }
                drawSpark(e.s, hist[k], data.c == null || data.c >= 0);
            } else {
                e.p.textContent = '—';
                e.c.innerHTML = '<span class="ar">◆</span> --';
                e.c.className = 'change neu';
            }
        }

        function renderAll(live) {
            for (const k of Object.keys(els).filter(x => typeof els[x] === 'object' && els[x].p)) {
                const lv = live ? live[k] : null;
                const hasLv = lv && ok(lv.p);
                const ca = last ? last[k] : null;
                const data = hasLv ? lv : (ca && ok(ca.p) ? ca : null);
                renderCard(k, data, !hasLv && data != null);
            }
            drawBig();
        }

        // ================== Spark ==================
        function drawSpark(svg, pts, up) {
            if (!svg) return;
            if (!pts || pts.length < 2) {
                svg.innerHTML = '<line x1="0" y1="25" x2="100" y2="25" stroke="rgba(127,127,127,0.2)" stroke-dasharray="3 3"/>';
                return;
            }
            const W = 100, H = 50, P = 2;
            let mn = Infinity, mx = -Infinity;
            for (const v of pts) { if (v < mn) mn = v; if (v > mx) mx = v; }
            const r = (mx - mn) || 1;
            const sx = (W - P * 2) / (pts.length - 1);
            const c = [];
            for (let i = 0; i < pts.length; i++) c.push([P + i * sx, H - P - ((pts[i] - mn) / r) * (H - P * 2)]);
            let d = '';
            for (let i = 0; i < c.length; i++) d += (i ? 'L' : 'M') + c[i][0] + ',' + c[i][1];
            const a = d + ' L' + (W - P) + ',' + (H - P) + ' L' + P + ',' + (H - P) + ' Z';
            const col = up ? '#4ade80' : '#f87171';
            const id = 'g' + Math.random().toString(36).slice(2, 7);
            svg.innerHTML =
                '<defs><linearGradient id="' + id + '" x1="0" y1="0" x2="0" y2="1">' +
                '<stop offset="0%" stop-color="' + col + '" stop-opacity="0.45"/>' +
                '<stop offset="100%" stop-color="' + col + '" stop-opacity="0"/>' +
                '</linearGradient></defs>' +
                '<path d="' + a + '" fill="url(#' + id + ')"/>' +
                '<path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>';
        }

        // ================== Big chart ==================
        function drawBig() {
            const svg = els.bigChart; if (!svg) return;
            const keys = Object.keys(hist).filter(k => vis[k] && hist[k].length >= 2);
            if (!keys.length) {
                svg.innerHTML = '<text x="500" y="120" fill="rgba(127,127,127,0.4)" font-size="14" text-anchor="middle">Waiting…</text>';
                return;
            }
            const paths = {};
            let all = [];
            for (const k of keys) {
                const a = hist[k], f = a[0] || 1;
                const p = a.map(v => ((v - f) / f) * 100);
                paths[k] = p; all = all.concat(p);
            }
            const mn = Math.min(...all), mx = Math.max(...all);
            const rng = (mx - mn) || 1;
            const yp = rng * 0.15;
            const yMn = mn - yp, yMx = mx + yp, yR = yMx - yMn;
            const W = 1000, H = 240, pL = 40, pR = 16, pT = 14, pB = 22;
            const iW = W - pL - pR, iH = H - pT - pB;
            let maxL = 0;
            for (const k of keys) if (hist[k].length > maxL) maxL = hist[k].length;
            const sx = iW / (maxL - 1 || 1);

            let out = '';
            for (let i = 0; i <= 3; i++) {
                const y = pT + (iH / 3) * i;
                const v = yMx - (yR / 3) * i;
                out += '<line x1="' + pL + '" y1="' + y + '" x2="' + (W - pR) + '" y2="' + y + '" stroke="rgba(127,127,127,0.15)" stroke-dasharray="2 4"/>';
                out += '<text x="' + (pL - 6) + '" y="' + (y + 3) + '" fill="rgba(127,127,127,0.5)" font-size="9" text-anchor="end">' + v.toFixed(1) + '%</text>';
            }
            for (const k of keys) {
                const p = paths[k], col = colors[k];
                const coords = p.map((v, i) => [pL + i * sx, pT + ((yMx - v) / yR) * iH]);
                let d = '';
                for (let i = 0; i < coords.length; i++) d += (i ? 'L' : 'M') + coords[i][0] + ',' + coords[i][1];
                const a = d + ' L' + coords[coords.length-1][0] + ',' + (pT + iH) + ' L' + coords[0][0] + ',' + (pT + iH) + ' Z';
                const id = 'b' + Math.random().toString(36).slice(2, 7);
                out += '<defs><linearGradient id="' + id + '" x1="0" y1="0" x2="0" y2="1">' +
                       '<stop offset="0%" stop-color="' + col + '" stop-opacity="0.15"/>' +
                       '<stop offset="100%" stop-color="' + col + '" stop-opacity="0"/>' +
                       '</linearGradient></defs>' +
                       '<path d="' + a + '" fill="url(#' + id + ')"/>' +
                       '<path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="2" opacity="0.85"/>';
            }
            svg.innerHTML = out;
        }

        // ================== Cache ==================
        function save() {
            if (!last) return;
            try { localStorage.setItem(STORE, JSON.stringify({ d: last, h: hist })); } catch (_) {}
        }
        function load() {
            try {
                const r = localStorage.getItem(STORE);
                if (!r) return null;
                const o = JSON.parse(r);
                return (o && o.d) ? o : null;
            } catch (_) { return null; }
        }

        // ================== Main ==================
        async function update() {
            if (busy) return;
            busy = true;
            ['gold', 'doge', 'btc', 'eth'].forEach(k => {
                const c = document.querySelector('[data-coin="' + k + '"]');
                if (c) c.classList.add('loading');
            });

            const live = { gold: null, doge: null, btc: null, eth: null };
            let n = 0;
            try {
                const [g, d, b, e] = await Promise.all([
                    getGold(),
                    getCrypto('doge-dogecoin', 'dogecoin', 'DOGE-USD'),
                    getCrypto('btc-bitcoin',  'bitcoin',  'BTC-USD'),
                    getCrypto('eth-ethereum', 'ethereum', 'ETH-USD'),
                ]);
                live.gold = g; live.doge = d; live.btc = b; live.eth = e;
                n = Object.values(live).filter(v => v && ok(v.p)).length;
            } catch (_) {}

            for (const k of Object.keys(live)) {
                if (live[k] && ok(live[k].p)) {
                    last = last || {};
                    last[k] = { p: live[k].p, c: typeof live[k].c === 'number' ? live[k].c : null };
                }
            }
            renderAll(live);

            const b = els.badge;
            if (n === 4) { b.classList.remove('warn'); b.innerHTML = '<span class="dot"></span>LIVE'; ever = true; }
            else if (n > 0) { b.classList.remove('warn'); b.innerHTML = '<span class="dot"></span>' + n + '/4'; ever = true; }
            else { b.classList.add('warn'); b.innerHTML = '<span class="dot"></span>CACHED'; }

            ['gold', 'doge', 'btc', 'eth'].forEach(k => {
                const c = document.querySelector('[data-coin="' + k + '"]');
                if (c) c.classList.remove('loading');
            });
            busy = false;
            save();
        }

        // ================== Init ==================
        const c = load();
        if (c && c.d) {
            last = c.d;
            if (c.h) for (const k of Object.keys(hist)) if (Array.isArray(c.h[k])) hist[k] = c.h[k].slice(-MAX_PTS);
            renderAll(null);
            ever = true;
        }

        // ================== Events ==================
        document.querySelectorAll('.card').forEach(card => {
            card.addEventListener('click', () => update());
        });
        document.querySelectorAll('.leg').forEach(item => {
            item.addEventListener('click', () => {
                const k = item.dataset.key;
                vis[k] = !vis[k];
                item.classList.toggle('off', !vis[k]);
                drawBig();
            });
        });
        els.theme.addEventListener('click', () => {
            document.body.classList.toggle('light');
            const isL = document.body.classList.contains('light');
            els.theme.textContent = isL ? '☀️' : '🌙';
            try { localStorage.setItem('theme', isL ? 'light' : 'dark'); } catch (_) {}
        });
        try {
            if (localStorage.getItem('theme') === 'light') {
                document.body.classList.add('light');
                els.theme.textContent = '☀️';
            }
        } catch (_) {}

        // ================== Boot ==================
        update();
        clearInterval(refT);
        refT = setInterval(update, REFRESH * 1000);
        tick();
        setInterval(save, 5000);

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) { update(); cd = REFRESH; els.cd.textContent = cd; }
        });
    })();
    </script>
</body>
</html>
